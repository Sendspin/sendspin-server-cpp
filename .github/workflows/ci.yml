---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: esphome/pre-commit-action@43cd1109c09c544d97196f7730ee5b2e0cc6d81e # v3.0.1 fork with pinned actions/cache

  lint:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy libssl-dev pkg-config libavahi-client-dev

      - name: Run clang-tidy
        run: ./script/clang-tidy.sh

  # Every host job compiles through ccache. It restores its newest cache, but only pushes to main
  # save one, so PR runs reuse main's objects without filling the repository's cache quota.
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The library and the server_cli example, without sanitizers
          - name: Linux x86-64
            os: ubuntu-24.04
            cache: ubuntu-24.04
            install: sudo apt-get update && sudo apt-get install -y ccache libssl-dev pkg-config libavahi-client-dev
            source: .
          - name: macOS arm64
            os: macos-15
            cache: macos-15
            install: brew install ccache openssl@3
            source: .
          # The options the other jobs leave at their defaults, flipped (the tests need Opus)
          - name: Linux x86-64, Opus and discovery off, memory statistics on
            os: ubuntu-24.04
            cache: features-off
            install: sudo apt-get update && sudo apt-get install -y ccache libssl-dev pkg-config
            source: .
            options: -DSENDSPIN_SERVER_ENABLE_OPUS=OFF -DSENDSPIN_SERVER_ENABLE_DISCOVERY=OFF -DSENDSPIN_SERVER_MEMORY_STATS=ON
          # The library as a subproject (tests/consumer/)
          - name: Linux x86-64, consumer project
            os: ubuntu-24.04
            cache: consumer
            install: sudo apt-get update && sudo apt-get install -y ccache libssl-dev pkg-config libavahi-client-dev
            source: tests/consumer
            options: -DSENDSPIN_SERVER_USE_CCACHE=ON
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-build-${{ matrix.cache }}-${{ github.sha }}
          restore-keys: ccache-build-${{ matrix.cache }}-

      - name: Configure CMake
        run: cmake -S ${{ matrix.source }} -B build -DSENDSPIN_SERVER_ENABLE_WERROR=ON ${{ matrix.options }}

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build --parallel 4
          ccache --show-stats

      - name: Save ccache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-build-${{ matrix.cache }}-${{ github.sha }}

  test-linux:
    name: Unit tests (Linux x86-64, ASan)
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libssl-dev pkg-config libavahi-client-dev

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-linux-${{ github.sha }}
          restore-keys: ccache-test-linux-

      - name: Configure CMake
        run: cmake -B build-asan -DSENDSPIN_SERVER_ENABLE_WERROR=ON -DSENDSPIN_SERVER_BUILD_TESTS=ON -DSENDSPIN_SERVER_ENABLE_SANITIZERS=ON .

      - name: Build
        # One compile per core: a bare --parallel lets make start them all at once, and GCC
        # takes up to 2.3 GB to compile one of these sanitized sources
        run: |
          ccache --zero-stats
          cmake --build build-asan --parallel 4
          ccache --show-stats

      - name: Save ccache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-linux-${{ github.sha }}

      - name: Run tests
        # The realtime tests on their own, the rest in parallel (tests/CMakeLists.txt); both
        # sets run when one fails
        run: |
          status=0
          ctest --test-dir build-asan --output-on-failure -LE realtime -j 4 || status=1
          ctest --test-dir build-asan --output-on-failure -L realtime || status=1
          exit $status

  # The host suite under the embedded profile (src/profile.h), the limits the ESP-IDF build uses
  test-embedded:
    name: Unit tests (Linux x86-64, ASan, embedded profile)
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libssl-dev pkg-config libavahi-client-dev

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-embedded-${{ github.sha }}
          restore-keys: ccache-test-embedded-

      - name: Configure CMake
        run: cmake -B build-embedded -DSENDSPIN_SERVER_ENABLE_WERROR=ON -DSENDSPIN_SERVER_BUILD_TESTS=ON -DSENDSPIN_SERVER_ENABLE_SANITIZERS=ON -DSENDSPIN_SERVER_EMBEDDED_PROFILE=ON .

      - name: Build
        # One compile per core: a bare --parallel lets make start them all at once, and GCC
        # takes up to 2.3 GB to compile one of these sanitized sources
        run: |
          ccache --zero-stats
          cmake --build build-embedded --parallel 4
          ccache --show-stats

      - name: Save ccache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-embedded-${{ github.sha }}

      - name: Run tests
        # The realtime tests on their own, the rest in parallel (tests/CMakeLists.txt); both
        # sets run when one fails
        run: |
          status=0
          ctest --test-dir build-embedded --output-on-failure -LE realtime -j 4 || status=1
          ctest --test-dir build-embedded --output-on-failure -L realtime || status=1
          exit $status

  test-tsan:
    name: Unit tests (Linux x86-64, TSan)
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libssl-dev pkg-config libavahi-client-dev

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-tsan-${{ github.sha }}
          restore-keys: ccache-test-tsan-

      - name: Configure CMake
        run: cmake -B build-tsan -DSENDSPIN_SERVER_ENABLE_WERROR=ON -DSENDSPIN_SERVER_BUILD_TESTS=ON -DSENDSPIN_SERVER_ENABLE_TSAN=ON .

      - name: Build
        # One compile per core: a bare --parallel lets make start them all at once, and GCC
        # takes up to 2.3 GB to compile one of these sanitized sources
        run: |
          ccache --zero-stats
          cmake --build build-tsan --parallel 4
          ccache --show-stats

      - name: Save ccache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-tsan-${{ github.sha }}

      - name: Reduce mmap randomization
        # ThreadSanitizer aborts at startup with "unexpected memory mapping" under the 32-bit mmap
        # randomization the runner kernel defaults to
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Run tests
        # A report fails the test that made it; the realtime tests on their own, the rest in
        # parallel (tests/CMakeLists.txt); both sets run when one fails
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          status=0
          ctest --test-dir build-tsan --output-on-failure -LE realtime -j 4 || status=1
          ctest --test-dir build-tsan --output-on-failure -L realtime || status=1
          exit $status

  test-macos:
    name: Unit tests (macOS arm64, ASan)
    runs-on: macos-15
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: brew install ccache openssl@3

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-macos-${{ github.sha }}
          restore-keys: ccache-test-macos-

      - name: Configure CMake
        run: cmake -B build-asan -DSENDSPIN_SERVER_ENABLE_WERROR=ON -DSENDSPIN_SERVER_BUILD_TESTS=ON -DSENDSPIN_SERVER_ENABLE_SANITIZERS=ON .

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build-asan --parallel 3
          ccache --show-stats

      - name: Save ccache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-macos-${{ github.sha }}

      - name: Run tests
        # The realtime tests on their own, the rest in parallel (tests/CMakeLists.txt); both
        # sets run when one fails
        run: |
          status=0
          ctest --test-dir build-asan --output-on-failure -LE realtime -j 3 || status=1
          ctest --test-dir build-asan --output-on-failure -L realtime || status=1
          exit $status

  # The ESP-IDF component, compiled and linked into tests/esp_idf/'s application with warnings as
  # errors; the S3 build has internal RAM only, the P4 build PSRAM and the memory statistics
  esp-idf:
    name: ESP-IDF build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    strategy:
      fail-fast: false
      matrix:
        target: [esp32s3, esp32p4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C tests/esp_idf set-target ${{ matrix.target }}
          idf.py -C tests/esp_idf build

  ci:
    name: CI
    needs: [pre-commit, lint, build, test-linux, test-embedded, test-tsan, test-macos, esp-idf]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
